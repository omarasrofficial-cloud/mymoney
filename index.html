      /* AGGRESSIVELY HIDE NETLIFY INJECTED BADGE / OVERLAYS THAT BLOCK BUTTONS */
      #nl-badge-frame,
      iframe#nl-badge-frame,
      iframe[id*="nl-badge"],
      iframe[src*="netlify"],
      iframe[id*="netlify"],
      iframe[style*="2147483645"],
      iframe[style*="2147483647"],
      div[id*="netlify"],
      div[class*="netlify-badge"],
      div[class*="netlify"],
      a[href*="netlify.com"],
      div:has(> a[href*="netlify.com"]),
      div[style*="z-index: 2147483647"],
      div[style*="z-index:2147483647"],
      div[style*="z-index: 2147483645"],
      div[style*="z-index:2147483645"] {
        display: none !important;
        visibility: hidden !important;

        opacity: 0 !important;
        max-height: 0 !important;

  <body class="bg-gray-50 text-gray-900 dark:bg-slate-900 dark:text-gray-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script>
      // Automatically detect and remove any injected "Powered by Netlify" floating badge
      function removeNetlifyBadge() {
        try {
          var badge = document.getElementById('nl-badge-frame');
          if (badge) badge.remove();
          var hudScript = document.querySelector('script[src*="hud"]');
          if (hudScript) hudScript.remove();
          var iframes = document.querySelectorAll('iframe');
          iframes.forEach(function(f) {
            if (f.id && f.id.indexOf('nl-badge') !== -1) f.remove();
            if (f.style && (f.style.zIndex === '2147483645' || f.style.zIndex === '2147483647')) f.remove();
          });
          var els = document.querySelectorAll('iframe, div, a');
          els.forEach(function(el) {
            if (el.innerText && el.innerText.includes('Powered by Netlify')) {
              el.remove();
            }
            if (el.getAttribute('href') && el.getAttribute('href').includes('netlify.com') && el.innerText && el.innerText.includes('Netlify')) {
              var parent = el.closest('div');
              if (parent) parent.remove();
              else el.remove();
            }
          });
        } catch(e) {}
      }
      removeNetlifyBadge();
      var observer = new MutationObserver(removeNetlifyBadge);
      observer.observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
      window.addEventListener('load', removeNetlifyBadge);
      setInterval(removeNetlifyBadge, 200);
    </script>
